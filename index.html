<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบตรวจสอบเลขประจำตัวนักเรียน</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: url('https://img2.pic.in.th/818750841_943266318302223_1252899677845996428_n.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 420px;
      width: 90%;
      backdrop-filter: blur(10px);
    }
    .icon-header { font-size: 50px; margin-bottom: 10px; }
    h2 { color: #1a365d; margin: 0 0 10px 0; font-weight: 600; font-size: 24px; }
    p.subtitle { color: #4a5568; font-size: 14px; margin-bottom: 25px; }
    input[type="text"] {
      width: 100%; padding: 15px; margin-bottom: 20px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 18px; text-align: center; letter-spacing: 1px;
      transition: all 0.3s ease; color: #2d3748;
    }
    input[type="text"]:focus {
      outline: none; border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
    }
    button {
      width: 100%; border: none; padding: 14px; border-radius: 12px;
      cursor: pointer; font-size: 16px; font-weight: 500;
      transition: all 0.2s ease; display: flex; justify-content: center;
      align-items: center; gap: 8px;
    }
    button:active { transform: scale(0.98); }
    .btn-search {
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white; box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    }
    .btn-search:hover { background: linear-gradient(135deg, #2b6cb0 0%, #2c5282 100%); }
    #resultArea {
      margin-top: 25px; display: none; padding-top: 20px;
      border-top: 2px dashed #e2e8f0; animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .student-id { font-size: 42px; font-weight: 600; color: #e53e3e; margin: 10px 0; letter-spacing: 2px; }
    #copyStatus {
      color: #38a169; font-size: 14px; margin-top: 5px;
      display: none; font-weight: 500; background: #f0fff4;
      padding: 8px; border-radius: 8px;
    }
    .btn-copy { background-color: #edf2f7; color: #4a5568; margin-top: 15px; }
    .btn-copy:hover { background-color: #e2e8f0; }
    .btn-next {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      color: white; margin-top: 10px;
      box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
    }
    .btn-next:hover { background: linear-gradient(135deg, #38a169 0%, #2f855a 100%); }
    .loading-spinner {
      display: none; width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
      border-top-color: white; animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <div class="icon-header">🏫</div>
    <h2>ค้นหาเลขประจำตัว</h2>
    <p class="subtitle">กรุณากรอกเลขบัตรประจำตัวประชาชนนักเรียน<br>(13 หลัก)</p>
    
    <input type="text" id="nationalId" placeholder="เลขบัตรประชาชน 13 หลัก" maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    
    <button class="btn-search" onclick="searchId()" id="searchBtn">
      <span id="searchText">🔍 ค้นหาข้อมูล</span>
      <div class="loading-spinner" id="spinner"></div>
    </button>

    <div id="resultArea">
      <p style="margin-bottom: 0; color: #4a5568; font-size: 14px;">เลขประจำตัวนักเรียนคือ</p>
      <div class="student-id" id="studentIdDisplay">-</div>
      <div id="copyStatus">✅ คัดลอกเลขประจำตัวอัตโนมัติแล้ว!</div>
      
      <button class="btn-copy" onclick="manualCopy()">📋 คัดลอกอีกครั้ง</button>
      <button class="btn-next" onclick="goToNext()">➡️ ถัดไป (เข้าสู่ระบบ)</button>
    </div>
  </div>

  <script>
    function searchId() {
      const nationalId = document.getElementById('nationalId').value;
      if(nationalId.length < 13) {
        alert('กรุณากรอกเลขบัตรประจำตัวประชาชนให้ครบ 13 หลัก');
        return;
      }
      
      document.getElementById('searchText').innerText = "กำลังค้นหา...";
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('copyStatus').style.display = 'none';

      // ⚠️ นำ URL ของ Web App จาก Google Script มาใส่ในเครื่องหมายคำพูดด้านล่างนี้
      const scriptUrl = 'https://script.google.com/macros/s/AKfycbwCBmoDEytu6XF5pD5mHK-dkWoX6NzfgHZpzd2F-7VF3ijIuVse-T1foTvfUebjK5rsCQ/exec'; 
      
      fetch(scriptUrl + '?id=' + nationalId)
        .then(response => response.json())
        .then(data => {
          document.getElementById('searchText').innerText = "🔍 ค้นหาข้อมูล";
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('resultArea').style.display = 'block';

          if(data.status === 'success') {
            document.getElementById('studentIdDisplay').innerText = data.studentId;
            document.getElementById('studentIdDisplay').style.color = '#e53e3e';
            autoCopyId(data.studentId);
          } else {
            document.getElementById('studentIdDisplay').innerText = "ไม่พบข้อมูล";
            document.getElementById('studentIdDisplay').style.color = '#a0aec0';
          }
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('searchText').innerText = "🔍 ค้นหาข้อมูล";
          document.getElementById('spinner').style.display = 'none';
          alert('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง');
        });
    }

    function autoCopyId(text) {
        navigator.clipboard.writeText(text).then(() => {
          showCopySuccess();
        }).catch(err => console.error('ไม่สามารถคัดลอกได้', err));
    }

    function manualCopy() {
      const studentId = document.getElementById('studentIdDisplay').innerText;
      if(studentId && studentId !== "ไม่พบข้อมูล") {
        navigator.clipboard.writeText(studentId).then(() => showCopySuccess());
      }
    }

    function showCopySuccess() {
      const status = document.getElementById('copyStatus');
      status.style.display = 'block';
      setTimeout(() => { status.style.display = 'none'; }, 3000);
    }

    function goToNext() {
      window.location.href = "https://introom.org/pp5/student/login.php";
    }
  </script>
</body>
</html>
